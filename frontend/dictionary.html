<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diccionario - Corrector de Acentos</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="page-diccionario">
<div class="container">
  <div class="dict-header">
    <a href="/" class="dict-back">← Corrector</a>
    <h1>Diccionario de palabras</h1>
    <p class="dict-subtitle">Gestión del diccionario de acentos para nombres hispanos</p>
  </div>

  <div class="dict-card">
    <div class="dict-card-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Agregar nueva palabra
    </div>
    <div class="dict-card-body">
      <div class="add-row">
        <div class="add-field">
          <label for="addInput">Sin acentos</label>
          <input type="text" id="addInput" placeholder="Ej: MERLIN" spellcheck="false">
        </div>
        <div class="add-arrow">→</div>
        <div class="add-field">
          <label for="addAccentedInput">Con acentos</label>
          <input type="text" id="addAccentedInput" placeholder="Ej: MERLÍN" spellcheck="false">
        </div>
      </div>
      <button id="addBtn">Agregar al diccionario</button>
      <div id="addMsg" class="add-msg hidden"></div>
    </div>
  </div>

  <div class="dict-card">
    <div class="dict-card-header">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/></svg>
      Palabras registradas
    </div>
    <div class="dict-card-body">
      <div class="dict-toolbar">
        <span id="dictTotal" class="dict-total"></span>
        <div class="dict-search-wrap">
          <svg class="dict-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar palabra…" class="dict-search">
        </div>
      </div>
      <div id="dictLoading" class="dict-loading">
        <div class="spinner"></div>
        <span>Cargando palabras…</span>
      </div>
      <table class="dict-table hidden" id="dictTable">
        <thead>
          <tr><th>Sin acentos</th><th>Con acentos</th></tr>
        </thead>
        <tbody id="dictBody"></tbody>
      </table>
      <div id="dictEmpty" class="dict-empty hidden"></div>
      <div class="pagination" id="pagination"></div>
    </div>
  </div>
</div>
<script src="dictionary.js"></script>
</body>
</html>
