<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corrector de Acentos</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="logo">◈</div>
  <h1>Corrector de Acentos</h1>
  <p class="subtitle">Corrige acentos en nombres hispanos</p>

  <div class="card input-card">
    <label for="nombresInput">Nombre(s)</label>
    <input type="text" id="nombresInput" placeholder="Ej: JOSE" autofocus spellcheck="false">

    <label for="apellidosInput">Apellidos</label>
    <input type="text" id="apellidosInput" placeholder="Ej: GARCIA LOPEZ" spellcheck="false">

    <div class="options-row">
      <select id="ordenSelect">
        <option value="nombres_apellidos">Nombre(s) + Apellidos</option>
        <option value="apellidos_nombres">Apellidos + Nombre(s)</option>
      </select>
      <select id="formatoSelect">
        <option value="MAYUSCULAS">MAYÚSCULAS</option>
        <option value="minusculas">minúsculas</option>
        <option value="Capitalizado">Capitalizado</option>
      </select>
      <button id="correctBtn">Corregir</button>
    </div>

    <div id="result" class="result hidden">
      <div class="result-box">
        <div class="result-label">Original</div>
        <div id="originalDisplay" class="result-text original"></div>
      </div>
      <div class="result-arrow">→</div>
      <div class="result-box">
        <div class="result-label">Corregido</div>
        <div id="correctedDisplay" class="result-text corrected"></div>
      </div>
    </div>

    <div id="changes" class="changes"></div>
    <div id="error" class="error hidden"></div>
    <div id="loading" class="loading hidden">Corrigiendo…</div>
  </div>

  <div class="card">
    <h3 class="card-title">Pruebas rápidas</h3>
    <div class="test-buttons">
      <button class="test-btn" data-nombres="JOSE" data-apellidos="GARCIA LOPEZ">JOSE GARCIA LOPEZ</button>
      <button class="test-btn" data-nombres="MARIA" data-apellidos="RODRIGUEZ PEREZ">MARIA RODRIGUEZ PEREZ</button>
      <button class="test-btn" data-nombres="FELIX" data-apellidos="RAMIREZ QUINONES">FELIX RAMIREZ QUINONES</button>
      <button class="test-btn" data-nombres="RAUL" data-apellidos="SANCHEZ">RAUL SANCHEZ</button>
      <button class="test-btn" data-nombres="JESUS" data-apellidos="MARTINEZ">JESUS MARTINEZ</button>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
